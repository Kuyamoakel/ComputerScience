<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photo</title>
</head>

<body>
    <h1>Upload a Photo</h1>

    <input type="file" id="photoInput" accept="image/*">

    <br><br>


    <button id="previewButton">WANT TO SEE?</button>
    <br><br>

    <img id="preview" width="300" style="border-radius: 5px;">
    <br><br>

    <p id="fileName"></p>
    <p id="fileSize"></p>

    <script>
        const fileName = document.getElementById("fileName");
        const fileSize = document.getElementById("fileSize");
        const photoInput = document.getElementById("photoInput"); // simple variable lang itong tatlo
        const preview = document.getElementById("preview");
        const previewButton = document.getElementById("previewButton");

        // eventlisterner ang job neto ay kapag na click yung button tsaka siya gagana yung "click"
        // let's say na click yun file ay kukunin yung pictures sa input doon photoInput kaya files[0] kase nag ststart sa index of 0 yung mga photos
        // dapat kukunin yung pictures doon sa input
        previewButton.addEventListener("click", function () {
            const file = photoInput.files[0];

            //condition naman ay kapag true yung file tsaka siya mag rurun
            if (file) {
                const imageURL = URL.createObjectURL(file); // this part nag cre-create ito ng temporary local URL para sa preview
                preview.src = imageURL; // tapos para ma preview ito, ma display yung image.

                fileName.textContent = "File Name: " + file.name; // using textContent binago natin yung value nung <p> doon nilagyan lang natin ng id
                fileSize.textContent = "File Size: " + (file.size / 1024 / 1024).toFixed(2) + " MB"; // ito naman byte code talaga to pero using simple formula ay ginawa nating MB tapos 2 decimants using toFixed(2)
            }
        });
    </script>
</body>

</html>
